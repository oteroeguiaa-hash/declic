<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sprint des espèces : simulateur de courses 3D</title>
<meta name="description" content="Simulateur 3D de courses entre humains et animaux : physiologie réaliste, fatigue, endurance, accélération, plus de 400 espèces et races.">
<meta name="theme-color" content="#0e1116">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
  if (location.pathname === "/course") location.replace("/course/" + location.search + location.hash);
</script>
<style>
:root {
  --bg: #0e1116;
  --panel: rgba(18, 22, 30, 0.88);
  --panel-solid: #141922;
  --panel-2: #1b2230;
  --ink: #eef1f5;
  --muted: #9aa4b2;
  --line: rgba(238, 241, 245, 0.12);
  --accent: #ffb020;
  --accent-ink: #1a1204;
  --good: #3cc070;
  --bad: #e6463c;
  --chart-grid: rgba(238, 241, 245, 0.1);
  --chart-ink: #b8c2cf;
  --radius: 12px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
kbd { font: 11px ui-monospace, monospace; padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; background: rgba(255,255,255,0.06); }

/* ---------- Écran de préparation ---------- */
#setup { position: fixed; inset: 0; z-index: 20; display: grid; grid-template-rows: auto 1fr; background: radial-gradient(1200px 600px at 20% -10%, #1d2a40 0%, transparent 60%), radial-gradient(900px 500px at 110% 110%, #3a2410 0%, transparent 55%), var(--bg); }
#setup header { display: flex; align-items: baseline; gap: 14px; padding: 14px 20px 8px; flex-wrap: wrap; }
#setup h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
#setup h1 span { color: var(--accent); }
#setup header p { margin: 0; color: var(--muted); }
.cols { display: grid; grid-template-columns: minmax(300px, 1.1fr) minmax(300px, 1fr) minmax(280px, 0.85fr); gap: 14px; padding: 6px 20px 18px; min-height: 0; }
.col { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.col > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0; padding: 12px 14px 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.search { margin: 0 14px 8px; display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.chips { display: flex; gap: 6px; padding: 0 14px 8px; overflow-x: auto; scrollbar-width: thin; flex-wrap: nowrap; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 10px; font-size: 12px; white-space: nowrap; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.list { overflow-y: auto; padding: 0 8px 8px; flex: 1; min-height: 0; }
.sprow { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
.sprow:hover, .sprow.sel { background: rgba(255,255,255,0.06); }
.sprow .nm { font-weight: 550; }
.sprow .lt { font-size: 11.5px; color: var(--muted); font-style: italic; }
.sprow .sp { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; text-align: right; }
.sprow .add { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); font-size: 17px; line-height: 1; }
.sprow .add:hover { background: var(--accent); color: var(--accent-ink); }
.catHead { padding: 10px 8px 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
.fiche { border-top: 1px solid var(--line); padding: 10px 14px 12px; max-height: 42%; overflow-y: auto; background: rgba(0,0,0,0.15); }
.fiche h3 { margin: 0 0 2px; font-size: 16px; }
.fiche .note { color: var(--muted); font-size: 12.5px; margin: 6px 0 0; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 14px; margin-top: 8px; font-size: 12.5px; }
.stats div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--line); padding: 2px 0; }
.stats b { font-variant-numeric: tabular-nums; font-weight: 600; }
.lanes { overflow-y: auto; padding: 0 12px 10px; flex: 1; min-height: 0; }
.lane { border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 10px; padding: 9px 10px; margin-bottom: 8px; background: rgba(255,255,255,0.025); }
.lane .top { display: flex; align-items: center; gap: 8px; }
.lane .num { width: 22px; height: 22px; border-radius: 6px; background: var(--c); color: #111; font-weight: 700; display: grid; place-items: center; font-size: 12px; flex: none; }
.lane .ttl { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lane .x { border: 0; background: transparent; color: var(--muted); font-size: 18px; padding: 0 4px; }
.lane .x:hover { color: var(--bad); }
.ctl { display: grid; grid-template-columns: 112px 1fr 64px; align-items: center; gap: 8px; margin-top: 6px; font-size: 12.5px; }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); }
.ctl output { text-align: right; font-variant-numeric: tabular-nums; }
.ctl select { grid-column: 2 / 4; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
.lane .mini { margin-top: 6px; font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.lane .mini b { color: var(--ink); font-weight: 600; }
.empty { color: var(--muted); padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; margin: 0 12px 10px; }
.btn { border: 1px solid var(--line); background: rgba(255,255,255,0.06); border-radius: 9px; padding: 8px 12px; font-weight: 600; }
.btn:hover { background: rgba(255,255,255,0.12); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 7px; }
.settings { padding: 0 14px 12px; overflow-y: auto; flex: 1; min-height: 0; }
.field { margin: 0 0 12px; }
.field > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.seg { display: flex; flex-wrap: wrap; gap: 5px; }
.seg button { border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 5px 9px; font-size: 12.5px; }
.seg button.on { background: var(--ink); color: var(--bg); border-color: transparent; font-weight: 600; }
.field select, .field input[type=number] { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
.field input[type=range] { width: 100%; accent-color: var(--accent); }
.row2 { display: flex; gap: 8px; align-items: center; }
.pred { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.pred th, .pred td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.pred th:first-child, .pred td:first-child { text-align: left; }
.pred td.win { color: var(--good); font-weight: 700; }
.go { padding: 12px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
.go .btn.primary { flex: 1; font-size: 16px; padding: 12px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; }

/* ---------- Course ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
#hud > * { pointer-events: auto; }
#topbar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 14px; backdrop-filter: blur(6px); }
#chrono { font: 700 30px/1 ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; min-width: 150px; text-align: center; color: var(--accent); }
#raceInfo { font-size: 12.5px; color: var(--muted); line-height: 1.3; }
#raceInfo b { color: var(--ink); }
#board { position: absolute; top: 72px; left: 10px; width: min(560px, calc(100vw - 20px)); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; backdrop-filter: blur(6px); max-height: calc(100vh - 350px); overflow: auto; }
#board table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
#board th { font-weight: 500; color: var(--muted); text-align: right; padding: 3px 5px; font-size: 11px; white-space: nowrap; }
#board td { text-align: right; padding: 3px 5px; white-space: nowrap; border-top: 1px solid var(--line); }
#board th:nth-child(2), #board td:nth-child(2) { text-align: left; }
#board tr.focus td { background: rgba(255,255,255,0.07); }
#board tr { cursor: pointer; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.bar { display: inline-block; width: 46px; height: 7px; border-radius: 4px; background: rgba(255,255,255,0.12); position: relative; overflow: hidden; vertical-align: 1px; margin-left: 4px; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--good); }
.bar.f i { background: var(--bad); }
.nm2 { max-width: 150px; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: bottom; }
.gait { color: var(--muted); font-size: 11px; }
#chartBox { position: absolute; left: 10px; bottom: 10px; width: min(560px, calc(100vw - 20px)); height: 190px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; backdrop-filter: blur(6px); }
#chartBox canvas { width: 100%; height: 100%; display: block; }
#controls { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.ctrlrow { display: flex; gap: 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 5px; backdrop-filter: blur(6px); flex-wrap: wrap; justify-content: flex-end; }
.ctrlrow button { border: 1px solid transparent; background: transparent; border-radius: 7px; padding: 5px 9px; font-size: 12.5px; }
.ctrlrow button.on { background: var(--ink); color: var(--bg); font-weight: 600; }
.ctrlrow button:hover:not(.on) { background: rgba(255,255,255,0.1); }
.ctrlrow .lbl { color: var(--muted); font-size: 11.5px; padding: 5px 2px 5px 6px; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; transform: translate(-50%, -100%); font-size: 11.5px; font-weight: 650; padding: 2px 7px; border-radius: 6px; background: rgba(10,12,16,0.72); border: 1.5px solid var(--c); white-space: nowrap; pointer-events: none; }
.tag i { font-style: normal; color: var(--c); margin-right: 4px; }
#announce { position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); font: 800 clamp(34px, 7vw, 80px)/1 system-ui, sans-serif; text-shadow: 0 4px 30px rgba(0,0,0,0.6); letter-spacing: -0.02em; text-align: center; pointer-events: none; transition: opacity .3s; }
#announce small { display: block; font-size: 0.32em; font-weight: 600; opacity: 0.85; margin-top: 10px; letter-spacing: 0; }
#focusInfo { position: absolute; right: 10px; top: 72px; width: 270px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; backdrop-filter: blur(6px); font-size: 12.5px; }
#focusInfo h4 { margin: 0 0 6px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
#focusInfo .kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-variant-numeric: tabular-nums; }
#focusInfo .kv span:nth-child(odd) { color: var(--muted); }
#focusInfo .big { font: 700 26px/1.1 ui-monospace, monospace; color: var(--accent); }

/* ---------- Résultats ---------- */
#results { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(5,7,10,0.6); backdrop-filter: blur(4px); padding: 16px; }
#results .card { width: min(1100px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
#results h2 { margin: 0 0 4px; font-size: 22px; }
.podium { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; margin: 12px 0; }
.podium th { text-align: right; color: var(--muted); font-weight: 500; padding: 5px 7px; font-size: 12px; white-space: nowrap; }
.podium td { text-align: right; padding: 6px 7px; border-top: 1px solid var(--line); white-space: nowrap; }
.podium th:nth-child(-n+2), .podium td:nth-child(-n+2) { text-align: left; }
.podium tr:first-of-type td { font-weight: 600; }
.medal { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-weight: 800; font-size: 12px; color: #111; }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.charts .cb { background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 10px; height: 230px; padding: 6px; }
.charts canvas { width: 100%; height: 100%; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; margin: 6px 0 0; }
.explain { color: var(--muted); font-size: 13px; margin: 10px 0 0; line-height: 1.5; }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }

#loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 40; background: var(--bg); color: var(--muted); }

@media (max-width: 1100px) {
  .cols { grid-template-columns: 1fr 1fr; overflow-y: auto; }
  .col.cfg { grid-column: 1 / 3; }
  #setup { overflow-y: auto; grid-template-rows: auto auto; }
  .col { max-height: 78vh; }
}
@media (max-width: 760px) {
  #setup { display: block; overflow-y: auto; }
  #setup header { padding: 12px 16px 6px; }
  #setup h1 { font-size: 22px; }
  #setup header p { font-size: 12.5px; }
  .cols { display: flex; flex-direction: column; padding: 6px 12px 16px; overflow: visible; }
  .col { max-height: none; overflow: visible; }
  .list { flex: none; height: 46vh; }
  .lanes, .settings { flex: none; overflow: visible; }
  .fiche { max-height: none; }
  .go { position: sticky; bottom: 0; background: var(--panel-solid); border-radius: 0 0 var(--radius) var(--radius); }
  #board { top: 8px; left: 8px; width: calc(100vw - 16px); max-height: 30vh; font-size: 11px; }
  #board .opt, #board .small { display: none; }
  .nm2 { max-width: 110px; }
  #focusInfo { display: none; }
  #chartBox { left: 8px; width: calc(100vw - 16px); height: 92px; bottom: 132px; }
  #topbar { top: auto; bottom: 232px; left: 8px; transform: none; padding: 4px 10px; }
  #chrono { font-size: 20px; min-width: 96px; }
  #raceInfo { display: none; }
  .charts { grid-template-columns: 1fr; }
  #controls { left: 8px; right: 8px; bottom: 8px; align-items: stretch; gap: 4px; }
  .ctrlrow { justify-content: flex-start; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 3px; }
  .ctrlrow button { flex: none; padding: 6px 9px; }
  #announce { top: 40%; }
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="loading">Chargement du simulateur…</div>

<section id="setup" class="hidden">
  <header>
    <h1>Sprint des <span>espèces</span></h1>
    <p id="countLine"></p>
  </header>
  <div class="cols">
    <div class="col">
      <h2>Catalogue <span class="muted small" id="catCount"></span></h2>
      <div class="search"><input id="q" type="search" placeholder="Rechercher une espèce, une race, un nom latin…" autocomplete="off"></div>
      <div class="chips" id="cats"></div>
      <div class="list" id="list"></div>
      <div class="fiche" id="fiche"><span class="muted small">Sélectionne une espèce pour voir sa fiche physiologique.</span></div>
    </div>
    <div class="col">
      <h2>Concurrents <span id="laneCount" class="muted"></span>
        <span class="row2"><button class="btn sm" id="btnRandom" title="Tirer deux concurrents au hasard">Au hasard</button><button class="btn sm" id="btnClear">Vider</button></span></h2>
      <div class="lanes" id="lanes"></div>
    </div>
    <div class="col cfg">
      <h2>Course</h2>
      <div class="settings">
        <div class="field"><label>Distance</label><div class="seg" id="dist"></div>
          <div class="row2" style="margin-top:6px"><input type="number" id="distCustom" min="1" max="100000" step="1" placeholder="Distance personnalisée (m)"></div></div>
        <div class="field"><label>Terrain</label><select id="terrain"></select></div>
        <div class="field"><label>Météo</label><select id="weather"></select></div>
        <div class="field"><label>Température : <b id="tempOut">20 °C</b></label><input type="range" id="temp" min="-20" max="45" step="1" value="20"></div>
        <div class="field"><label class="check"><input type="checkbox" id="scaleSmall" checked> Agrandir visuellement les très petits animaux</label>
          <div class="muted small" style="margin-top:3px">La physique reste à l'échelle réelle ; seule l'image est agrandie.</div></div>
        <div class="field"><label>Prévision du modèle (même course, sans aléa)</label><div id="pred" class="muted small" style="overflow-x:auto">Ajoute au moins deux concurrents.</div></div>
      </div>
      <div class="go"><button class="btn primary" id="btnGo" disabled>Lancer la course</button></div>
    </div>
  </div>
</section>

<section id="hud" class="hidden">
  <div id="labels"></div>
  <div id="board"></div>
  <div id="topbar"><div id="chrono">0,00</div><div id="raceInfo"></div></div>
  <div id="focusInfo"></div>
  <div id="announce"></div>
  <div id="chartBox"><canvas id="liveChart"></canvas></div>
  <div id="controls">
    <div class="ctrlrow" id="camRow"><span class="lbl">Caméra</span></div>
    <div class="ctrlrow" id="speedRow"><span class="lbl">Vitesse</span></div>
    <div class="ctrlrow">
      <button id="btnPause">Pause</button>
      <button id="btnFinish" title="Calculer immédiatement la fin de la course">Terminer</button>
      <button id="btnRestart">Rejouer</button>
      <button id="btnQuit">Nouvelle course</button>
    </div>
  </div>
</section>

<section id="results" class="hidden"><div class="card" id="resCard"></div></section>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
